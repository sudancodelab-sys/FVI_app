welcome:
  title: Welcome, Little Learner!
  lead: Let's learn the English alphabet together!
  paragraphs:
    - There are 26 letters. Every letter has a capital letter and a small letter.
    - Look at each model, say the letter, copy it, and write it by yourself.
    - Use the word example to practice your new letter.
  steps:
    - Look
    - Say
    - Copy
    - Write
  encouragement: You can do it! One letter at a time.

guide:
  title: How to Use the Four Guide Lines
  lead: The four lines help you write each letter in the right place.
  labels:
    - name: TOP LINE
      hint: Many capital letters start here.
    - name: MIDDLE LINE
      hint: Small letters start here.
    - name: BASE LINE
      hint: Letters rest here.
    - name: BOTTOM LINE
      hint: Letter tails reach here.
  notes:
    - Most capital letters start at the top line and sit on the base line.
    - Small letters usually sit between the middle line and the base line.
    - Tall small letters reach the top line. Letter tails go down to the bottom line.
    - Capital J and Q can dip below the base line.
  examples:
    - {label: "CAPITAL LETTERS", sample: "A A A A", style: cap, caption: "TOP TO BASE"}
    - {label: "SMALL LETTERS", sample: "a a a a", style: small, caption: "MIDDLE TO BASE"}
    - {label: "LETTER TAILS", sample: "p p p p", style: small, caption: "BASE TO BOTTOM"}

