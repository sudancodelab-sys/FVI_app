conversations:
  - title: Hello, Friend!
    scene: Adam and Sara meet for the first time.
    lines:
      - {speaker: Adam, text: "Hello! My name is Adam. What is your name?", side: left, color: navy}
      - {speaker: Sara, text: "Hi, Adam! My name is Sara.", side: right, color: orange}
      - {speaker: Adam, text: "Nice to meet you.", side: left, color: navy}
      - {speaker: Sara, text: "Nice to meet you, too!", side: right, color: orange}
    practice_items:
      - {label: ASK, text: "What is your name?"}
      - {label: ANSWER, text: "My name is _____."}
    words: [hello, name, friend]
  - title: In the Classroom
    scene: The class greets Mr. Ali and gets ready to learn.
    lines:
      - {speaker: Mr. Ali, text: "Hello, class!", side: left, color: navy}
      - {speaker: Class, text: "Hello, Mr. Ali!", side: right, color: orange}
      - {speaker: Mr. Ali, text: "Open your book, please.", side: left, color: navy}
      - {speaker: Sara, text: "I am ready!", side: right, color: orange}
      - {speaker: Adam, text: "Me too!", side: left, color: navy}
    practice_items:
      - {label: SAY, text: "Open your book, please."}
      - {label: ANSWER, text: "I am ready!"}
    words: [book, please, ready]

self_introduction:
  title: This Is Me!
  lead: Use the words to tell a new friend about yourself.
  lines:
    - Hello! My name is _______________.
    - I am ______ years old.
    - I like _________________________.
    - My favorite color is ____________.
    - Nice to meet you!
  write_prompts:
    - Write your name on the four guide lines.
    - Write one thing you like on the four guide lines.

certificate:
  title: I Finished Kids English 1!
  statement: I can write capital and small letters from A to Z.
  statement2: I can say my name and talk with a new friend.
  name_label: "This book belongs to:"
  teacher_label: "Teacher:"
  date_label: "Date:"
