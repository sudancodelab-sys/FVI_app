  - {word: mobile, meaning: that you can carry with you}
  - {word: post, meaning: the letters that are brought to your home}
  - {word: wire, meaning: a long thin metal line for electricity}
  - {word: whole, meaning: all of it}
  - {word: miss, meaning: feel sad because something is not there now}
