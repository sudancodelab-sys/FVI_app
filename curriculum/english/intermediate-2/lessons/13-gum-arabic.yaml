      - {icon: ship, term: selling, text: sent all over the world}
did_you_know: The "gum arabic belt" is a long line of acacia trees across Africa, south of the Sahara, from Senegal in the west to Sudan in the east.
questions:
  - ["Where does gum arabic come from?", "From the acacia tree."]
  - ["Which country is the biggest producer?", "Sudan."]
  - ["Where in Sudan does most of the gum come from?", "Kordofan and Darfur."]
  - ["What is tapping?", "Making small cuts in the bark of the trees."]
  - ["What happens to the liquid in the sun?", "It slowly becomes hard."]
  - ["How are the pieces picked?", "By hand."]
  - ["What is gum arabic used for?", "Drinks, sweets, pills, ink, and paint."]
  - ["How does the acacia tree help the land?", "Its roots stop the sand from moving."]
