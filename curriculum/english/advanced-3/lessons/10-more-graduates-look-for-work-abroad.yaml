  - ["What is the brain drain?", "The loss of skilled people to other countries."]
  - ["What does the professor say it is time for?", "For the government to make it easier for young people to stay."]
  - ["What would more than half of them rather do?", "Come back within ten years."]
  - ["What has one airline started to do?", "Hold places for young pilots who train abroad."]
idioms:
  - {expr: make ends meet, type: idiom, meaning: to have just enough money for the things you need, example: "With prices so high, many families find it hard to make ends meet."}
  - {expr: brain drain, type: phrase, meaning: when many educated or skilled people leave their country to work in another, example: "The country lost many of its doctors to the brain drain."}
