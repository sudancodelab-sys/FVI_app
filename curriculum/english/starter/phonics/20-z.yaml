lesson: 20
letters: [Z]
title: The Letter Z
intro: Z is the last letter of the alphabet. It has one sound.
sounds:
  - ipa: z
    name: Like /s/ with your voice on
    examples: ["[z]oo", "[z]ero", "la[z]y"]
silent:
  none: Z is never silent.
teams:
  - letters: zz
    reliability: almost
    sounds:
      - {ipa: z, examples: ["bu[zz]", "ja[zz]", "fi[zz]"]}
    note: "One common word is different: pizza says /ts/."
chart_title: All the Sounds of American English
chart_intro: Every sound you learned in this book, with a word you know.
