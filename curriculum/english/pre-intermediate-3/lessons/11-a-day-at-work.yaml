questions:
  - ["What is Mr. Hassan's job?", "He's a bus driver."]
  - ["Which bus does he drive?", "The green bus, from the bus station to the market."]
  - ["What time does he start work?", "At six o'clock."]
  - ["Why does he like his job?", "Because he helps people every day."]
  - ["What was he doing when the woman stood up?", "He was driving near the hospital."]
