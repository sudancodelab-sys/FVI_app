<title><!--TITLE--></title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lexend:wght@400;500;600&family=Noto+Sans:wght@600&display=swap">
<style>
/* Layout: one phone-width column. A note to the institute (Arabic, not part of the app), then the app itself: English unless the student picks Arabic as the app's language, the four sample lessons as tabs, and either one exercise at a time (as a student does them) or every exercise with its answer (to review). Colors and fonts are the app's (lib/src/theme.dart): Lexend for English, Cairo for Arabic. */
:root {
  --bg: #F5F6FA;
  --card: #FFFFFF;
  --ink: #1A1D3B;
  --muted: #6B6E8C;
  --line: #E2E4EE;
  --navy: #262E62;
  --navy-soft: #E8EAF6;
  --orange: #E4451A;
  --orange-soft: #FDEDE7;
  --green: #14935A;
  --green-soft: #E2F4EB;
  --red: #C62D2D;
  --red-soft: #FBE9E9;
  --on-accent: #FFFFFF;
  --shadow: 0 16px 36px -24px rgba(38, 46, 98, .45);
  --font-ar: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-en: "Lexend", "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12152B; --card: #1B1F3B; --ink: #ECEEF8; --muted: #A5A9C8; --line: #2C3157;
    --navy: #C9CEF2; --navy-soft: #262B52; --orange: #FF7A52; --orange-soft: #3A2224; --green: #5BD39B;
    --green-soft: #183527; --red: #FF8A8A; --red-soft: #3D1F26; --on-accent: #1B0E0A;
    --shadow: 0 16px 36px -24px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12152B; --card: #1B1F3B; --ink: #ECEEF8; --muted: #A5A9C8; --line: #2C3157;
  --navy: #C9CEF2; --navy-soft: #262B52; --orange: #FF7A52; --orange-soft: #3A2224; --green: #5BD39B;
  --green-soft: #183527; --red: #FF8A8A; --red-soft: #3D1F26; --on-accent: #1B0E0A;
  --shadow: 0 16px 36px -24px rgba(0, 0, 0, .7); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-en); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}
main { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
[lang="ar"] { font-family: var(--font-ar); line-height: 1.7; }
.en { font-family: var(--font-en); direction: ltr; text-align: left; unicode-bidi: isolate; }

/* The note to the institute */
.intro { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--orange); }
h1 { margin: 0; font-size: 30px; line-height: 1.3; font-weight: 800; color: var(--navy); text-wrap: balance; }
h1 span { display: block; font-size: 15.5px; font-weight: 600; color: var(--muted); margin-top: 4px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.facts li { font-size: 13.5px; font-weight: 700; padding: 2px 12px; border-radius: 99px; background: var(--orange-soft); font-variant-numeric: tabular-nums; }
.ask { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 15px; }
.ask li { display: flex; gap: 10px; align-items: baseline; }
.ask b { color: var(--orange); font-variant-numeric: tabular-nums; }
.note { margin: 0; font-size: 14px; color: var(--muted); }

/* The app */
.app { display: grid; gap: 14px; }
.bar-top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.seg { display: flex; gap: 4px; background: var(--navy-soft); padding: 4px; border-radius: 12px; }
.seg button { appearance: none; border: 0; background: transparent; cursor: pointer; padding: 5px 13px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg [lang="ar"] { font-weight: 700; }
.lang { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); font-weight: 600; }

.tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tab {
  appearance: none; text-align: start; cursor: pointer; background: var(--card); border: 1.5px solid var(--line);
  border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0;
}
.tab .lvl { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.tab .lvl bdi { white-space: nowrap; }
.tab .ttl { font-family: var(--font-en); font-weight: 600; font-size: 15px; overflow-wrap: anywhere; direction: ltr; unicode-bidi: isolate; text-align: left; }
[dir="rtl"] .tab .ttl { text-align: right; }
.tab .knd { font-family: var(--font-en); font-size: 11px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--k); }
.tab[aria-selected="true"] { border-color: var(--k); box-shadow: inset 0 0 0 1px var(--k); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.top { display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 8px; background: var(--navy-soft); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--orange); border-radius: 99px; transition: width .25s; }
.count { font-size: 13px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-en); font-size: 11.5px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--k); }
.how { margin: 0; font-weight: 700; font-size: 16px; }
.prompt { margin: 0; font-size: 20px; line-height: 1.5; font-weight: 500; }
.prompt .blank { display: inline-block; min-width: 3.2em; border-bottom: 2.5px solid var(--orange); margin: 0 2px; }
.example { margin: 0; font-size: 14.5px; color: var(--muted); }
.sound { margin: 0; font-family: "Lexend", "Noto Sans", sans-serif; font-size: 15px; font-weight: 600; color: var(--k); direction: ltr; text-align: left; }
.choices { display: grid; gap: 8px; }
.choice {
  appearance: none; cursor: pointer; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 10px 14px; font-family: var(--font-en); font-size: 16px; line-height: 1.45; min-height: 48px; direction: ltr;
}
.choice:hover:not(:disabled) { border-color: var(--navy); }
.choice:disabled { cursor: default; }
.choice.right { border-color: var(--green); background: var(--green-soft); }
.choice.wrong { border-color: var(--red); background: var(--red-soft); }

.built { min-height: 54px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; direction: ltr; }
.pool { display: flex; flex-wrap: wrap; gap: 6px; direction: ltr; }
.word { appearance: none; cursor: pointer; border: 1.5px solid var(--line); background: var(--navy-soft); border-radius: 10px; padding: 6px 12px; font-family: var(--font-en); font-size: 16px; min-height: 40px; }
.word:disabled { cursor: default; }
.built .word { background: var(--card); }
.built.right { border-style: solid; border-color: var(--green); background: var(--green-soft); }
.built.wrong { border-style: solid; border-color: var(--red); background: var(--red-soft); }

.feedback { margin: 0; font-weight: 700; display: grid; gap: 2px; }
.feedback.right { color: var(--green); }
.feedback.wrong { color: var(--red); }
.feedback .en { font-weight: 500; color: var(--ink); }
.actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.go { appearance: none; border: 0; cursor: pointer; background: var(--orange); color: var(--on-accent); font-weight: 700; font-size: 16px; padding: 9px 22px; border-radius: 12px; min-height: 44px; }
.go:disabled { opacity: .45; cursor: default; }
.go.ghost { background: transparent; color: var(--orange); box-shadow: inset 0 0 0 1.5px var(--orange); }

.done { text-align: center; display: grid; gap: 8px; justify-items: center; padding-block: 10px; }
.done .actions { justify-content: center; }
.score { font-size: 44px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1.2; }

.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; }
.item .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.item .n { font-size: 13px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.item .prompt { font-size: 16.5px; }
.item ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.item li { font-family: var(--font-en); font-size: 15px; padding: 3px 10px; border-radius: 8px; direction: ltr; text-align: left; }
.item li.ok { background: var(--green-soft); color: var(--green); font-weight: 600; }

@media (max-width: 480px) {
  body { padding-block: 16px; }
  .intro, .card { padding: 16px; }
  h1 { font-size: 25px; }
  .prompt { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<main>
<!--INTRO-->

  <div class="app" id="app">
    <div class="bar-top">
      <div class="seg" role="group" id="modes">
        <button type="button" data-mode="play" aria-pressed="true"></button>
        <button type="button" data-mode="review" aria-pressed="false"></button>
      </div>
      <div class="lang"><span id="lang-label"></span>
        <div class="seg" role="group" id="langs">
          <button type="button" data-lang="en" lang="en" aria-pressed="true">English</button>
          <button type="button" data-lang="ar" lang="ar" aria-pressed="false">العربية</button>
        </div>
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <section id="view" aria-live="polite"></section>
  </div>
</main>

<script>
(function () {
  const lessons = /*DATA*/[];
  // The app's words: English, unless the student picks Arabic as the app's language.
  const UI = {
    en: {
      how: { question: 'Choose the right answer.', meaning: 'What does this word mean?', idiom: 'What does this mean?',
             form: 'Complete the sentence as in the story.', reply: 'Choose the right reply.', order: 'Put the words in order.',
             letters: 'Which letters complete the word?', silent: 'Which letter is silent?' },
      play: 'Try it', review: 'All exercises', language: 'App language', lesson: 'Lesson', of: 'of', lessons: 'Lessons',
      check: 'Check', next: 'Next', score: 'See your score', right: 'Right!', answer: 'The right answer:',
      done: 'You finished the exercises of this lesson.', allRight: 'All right!',
      more: 'You can do them again, or look at all the answers.', again: 'Do them again', all: 'Look at all answers',
    },
    ar: {
      how: { question: 'اختر الجواب الصحيح حسب الدرس', meaning: 'ما معنى هذه الكلمة؟', idiom: 'ما معنى هذا التعبير؟',
             form: 'أكمل الجملة كما جاءت في القصة', reply: 'اختر الردّ المناسب', order: 'رتّب الكلمات لتكوّن العبارة',
             letters: 'اختر الحروف التي تكمل الكلمة', silent: 'أيّ حرف لا يُنطق؟' },
      play: 'جرّب', review: 'كل التمارين', language: 'لغة التطبيق', lesson: 'الدرس', of: 'من', lessons: 'الدروس',
      check: 'تحقّق', next: 'التالي', score: 'النتيجة', right: 'صحيح', answer: 'الجواب الصحيح:',
      done: 'انتهت تمارين الدرس.', allRight: 'كلها صحيحة.',
      more: 'يمكنك إعادة التمارين، أو رؤية أجوبتها كلها.', again: 'أعد التمارين', all: 'كل الأجوبة',
    },
  };
  const LABELS = { question: 'Questions', meaning: 'New words', idiom: 'Idioms, proverbs and phrases',
                   form: 'Grammar', reply: 'Useful phrases', order: 'Useful phrases',
                   letters: 'Sounds and letters', silent: 'Silent letters' };
  const COLORS = { story: '--orange', topic: '--navy', conversation: '--green', phonics: '--orange', speaking: '--green' };
  const state = { lesson: 0, mode: 'play', lang: 'en', index: 0, right: 0, answered: false };
  const app = document.getElementById('app');
  const view = document.getElementById('view');
  const tabs = document.getElementById('tabs');
  const t = () => UI[state.lang];

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  const kindColor = (kind) => `var(${COLORS[kind] || '--orange'})`;
  const answerText = (ex) => ex.type === 'order' ? ex.answer : ex.choices[ex.answer];

  function promptOf(ex) {
    const p = el('p', 'prompt en');
    if (ex.kind === 'letters') {  // a word: no spaces around its gap
      p.append(ex.before, el('span', 'blank'), ex.after);
    } else if (ex.kind === 'form') {
      p.append(ex.before ? ex.before + ' ' : '', el('span', 'blank'), ex.after ? ' ' + ex.after : '');
    } else {
      p.textContent = ex.prompt;
    }
    return p;
  }

  function renderChrome() {
    app.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
    app.lang = state.lang;
    document.getElementById('lang-label').textContent = t().language;
    document.querySelectorAll('#modes button').forEach((b) => {
      b.textContent = t()[b.dataset.mode];
      b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode));
    });
    document.querySelectorAll('#langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
    tabs.setAttribute('aria-label', t().lessons);
    tabs.replaceChildren(...lessons.map((l, i) => {
      const b = el('button', 'tab');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(i === state.lesson));
      b.style.setProperty('--k', kindColor(l.kind));
      const lvl = el('span', 'lvl');
      lvl.append(`${t().lesson} ${l.number} · `, el('bdi', '', l.level));
      b.append(lvl, el('span', 'ttl', l.title), el('span', 'knd', l.kind));
      b.addEventListener('click', () => { state.lesson = i; restart(); });
      return b;
    }));
  }

  function restart() {
    state.index = 0; state.right = 0; state.answered = false;
    render();
  }

  function render() {
    renderChrome();
    const lesson = lessons[state.lesson];
    view.style.setProperty('--k', kindColor(lesson.kind));
    if (state.mode === 'review') return renderReview(lesson);
    if (state.index >= lesson.exercises.length) return renderDone(lesson);
    renderExercise(lesson, lesson.exercises[state.index]);
  }

  function renderExercise(lesson, ex) {
    const total = lesson.exercises.length;
    const card = el('div', 'card');
    const top = el('div', 'top');
    const bar = el('div', 'bar');
    const fill = el('i');
    fill.style.width = (100 * state.index / total) + '%';
    bar.append(fill);
    top.append(el('span', 'count', `${state.index + 1} ${t().of} ${total}`), bar);
    card.append(top, el('div', 'label', LABELS[ex.kind]), el('p', 'how', t().how[ex.kind]));
    if (ex.kind === 'order') {
      if (ex.prompt) card.append(el('p', 'example en', ex.prompt));
    } else {
      if (ex.sound) card.append(el('p', 'sound', ex.sound));
      card.append(promptOf(ex));
      if (ex.example) card.append(el('p', 'example en', ex.example));
    }
    const feedback = el('p', 'feedback');
    const next = el('button', 'go', state.index + 1 < total ? t().next : t().score);
    next.type = 'button';
    next.hidden = true;
    next.addEventListener('click', () => { state.index++; state.answered = false; render(); });

    function finish(ok, button) {
      state.answered = true;
      if (ok) state.right++;
      feedback.className = 'feedback ' + (ok ? 'right' : 'wrong');
      feedback.replaceChildren(el('span', '', ok ? t().right : t().answer));
      if (!ok) feedback.append(el('span', 'en', answerText(ex)));
      next.hidden = false;
      if (button) button.hidden = true;
      next.focus();
    }

    const actions = el('div', 'actions');
    if (ex.type === 'choice') {
      const list = el('div', 'choices');
      ex.choices.forEach((c, i) => {
        const b = el('button', 'choice', c);
        b.type = 'button';
        b.addEventListener('click', () => {
          if (state.answered) return;
          list.querySelectorAll('button').forEach((x, j) => {
            x.disabled = true;
            if (j === ex.answer) x.classList.add('right');
          });
          if (i !== ex.answer) b.classList.add('wrong');
          finish(i === ex.answer);
        });
        list.append(b);
      });
      card.append(list, feedback);
      actions.append(next);
    } else {
      const built = el('div', 'built');
      const pool = el('div', 'pool');
      const check = el('button', 'go', t().check);
      check.type = 'button';
      check.disabled = true;
      const sync = () => { check.disabled = pool.children.length > 0; };
      ex.words.forEach((w) => {
        const b = el('button', 'word', w);
        b.type = 'button';
        b.addEventListener('click', () => {
          if (state.answered) return;
          (b.parentElement === pool ? built : pool).append(b);
          sync();
        });
        pool.append(b);
      });
      check.addEventListener('click', () => {
        const said = [...built.children].map((b) => b.textContent).join(' ');
        const ok = said === ex.answer;
        built.classList.add(ok ? 'right' : 'wrong');
        built.querySelectorAll('button').forEach((b) => { b.disabled = true; });
        finish(ok, check);
      });
      card.append(built, pool, feedback);
      actions.append(check, next);
    }
    card.append(actions);
    view.replaceChildren(card);
  }

  function renderDone(lesson) {
    const card = el('div', 'card done');
    const total = lesson.exercises.length;
    card.append(el('div', 'how', t().done), el('div', 'score', `${state.right} ${t().of} ${total}`),
                el('p', 'example', state.right === total ? t().allRight : t().more));
    const again = el('button', 'go', t().again);
    again.type = 'button';
    again.addEventListener('click', restart);
    const all = el('button', 'go ghost', t().all);
    all.type = 'button';
    all.addEventListener('click', () => { state.mode = 'review'; render(); });
    const actions = el('div', 'actions');
    actions.append(again, all);
    card.append(actions);
    view.replaceChildren(card);
  }

  function renderReview(lesson) {
    const list = el('ol', 'list');
    lesson.exercises.forEach((ex, n) => {
      const item = el('li', 'item');
      const head = el('div', 'head');
      head.append(el('span', 'n', String(n + 1)), el('span', 'label', LABELS[ex.kind]), el('span', 'example', t().how[ex.kind]));
      item.append(head);
      const ul = el('ul');
      if (ex.kind === 'order') {
        if (ex.prompt) item.append(el('p', 'example en', ex.prompt));
        item.append(el('p', 'prompt en', ex.words.join('  /  ')));
        ul.append(el('li', 'ok', ex.answer));
      } else {
        if (ex.sound) item.append(el('p', 'sound', ex.sound));
        item.append(promptOf(ex));
        if (ex.example) item.append(el('p', 'example en', ex.example));
        ex.choices.forEach((c, i) => ul.append(el('li', i === ex.answer ? 'ok' : '', c)));
      }
      item.append(ul);
      list.append(item);
    });
    view.replaceChildren(list);
  }

  document.querySelectorAll('#modes button').forEach((b) => b.addEventListener('click', () => {
    state.mode = b.dataset.mode;
    if (state.mode === 'play' && state.index >= lessons[state.lesson].exercises.length) restart();
    else render();
  }));
  document.querySelectorAll('#langs button').forEach((b) => b.addEventListener('click', () => {
    state.lang = b.dataset.lang;
    render();
  }));
  restart();
})();
</script>
