name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: fvi_core — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pub workspace holds the Flutter apps too, so it needs Flutter's pub.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages/fvi_core
      - run: dart analyze --fatal-infos
        working-directory: packages/fvi_core
      - run: dart test
        working-directory: packages/fvi_core

  apps:
    name: ${{ matrix.app }} app — analyze, test & APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [student, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      # What curriculum/tools/build.py needs for its checks, as in the sessions that wrote the books.
      - run: pip install pyyaml==6.0.3 jinja2==3.1.6 cmudict==1.1.3
      - run: flutter pub get
      # The levels from the approved books, encrypted with the keys of keys/dev (decision #49).
      - run: python3 curriculum/tools/export_app.py --out build/content
      - run: dart run content_builder build
      - run: flutter analyze
        working-directory: apps/${{ matrix.app }}
      - run: flutter test
        working-directory: apps/${{ matrix.app }}
      # Signed with the runner's debug key: a check that the app builds, not a release.
      - run: flutter build apk --release
        working-directory: apps/${{ matrix.app }}
