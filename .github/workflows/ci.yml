name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: fvi_core — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed packages/fvi_core
      - run: dart analyze --fatal-infos
        working-directory: packages/fvi_core
      - run: dart test
        working-directory: packages/fvi_core
