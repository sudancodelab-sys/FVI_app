<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>General story</title>
<link rel="stylesheet" href="ad.css">
<style>
/* The general ad as a WhatsApp status or story (9:16). The top and bottom 200px stay clear for the app's own bars. */
:root{--w:1080px;--h:1920px}
.ad{background:var(--ad-bg);color:var(--ad-fg);padding:200px 90px 200px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ring{position:absolute;border-radius:50%;border:2px solid var(--ad-ring)}
.ring.r1{width:1300px;height:1300px;left:-110px;top:-560px}
.ring.r2{width:960px;height:960px;left:60px;top:-390px}
.logo{width:180px;height:180px;box-shadow:0 0 0 2px var(--ad-card-line)}
.name{margin-top:22px;line-height:1.3}
.name b{display:block;font-size:52px;font-weight:800}
.name span{display:block;font-size:38px;font-weight:700;color:var(--ad-accent)}
.name i{display:block;font-style:normal;font-family:Lexend;font-weight:600;font-size:20px;letter-spacing:.12em;color:var(--ad-soft);margin-top:6px}
h1{margin-top:56px;font-weight:800;font-size:104px;line-height:1.12}
h1 span{display:block;color:var(--ad-accent)}
h1 .star{display:inline-block;width:64px;height:64px;fill:var(--ad-star);margin-right:18px;vertical-align:top;margin-top:10px}
.depts{margin-top:auto;padding-top:40px;width:100%;display:grid;gap:20px}
.dept{background:#fff;color:var(--ink);border:2px solid var(--ad-card-line);box-shadow:var(--ad-card-shadow);border-radius:30px;padding:22px 30px;display:flex;align-items:center;gap:28px;text-align:right}
.dept .ic{width:96px;height:96px;border-radius:26px;background:var(--orange-soft);display:grid;place-items:center;flex:none}
.dept .ic svg{width:54px;height:54px;stroke:var(--orange);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dept b{display:block;font-size:48px;font-weight:800;color:var(--navy);line-height:1.2}
.dept p{font-size:30px;font-weight:600;color:var(--muted);line-height:1.4}
.go{margin-top:44px;font-size:52px;font-weight:800;color:var(--ad-go-fg);background:var(--ad-go);border-radius:999px;padding:16px 90px 22px}
.wa{margin-top:26px;display:flex;align-items:center;gap:20px}
.wa svg{width:76px;height:76px;flex:none}
.wa small{display:block;font-size:28px;font-weight:600;color:var(--ad-soft);line-height:1.3;text-align:right}
.wa .num{display:block;font-family:Lexend;font-weight:700;font-size:56px;direction:ltr;unicode-bidi:isolate;white-space:nowrap;line-height:1.2}
</style>
</head>
<body>
<div class="ad ar">
  <div class="ring r1"></div><div class="ring r2"></div>
  <div class="logo"><img src="../../assets/branding/fvi_logo.png" alt=""></div>
  <div class="name"><b>معهد الرؤية المستقبلية</b><span>للحاسوب واللغات</span><i>FUTURE VISION INSTITUTE</i></div>

  <h1>رؤيتك للمستقبل<span>تبدأ من هنا<svg class="star" viewBox="0 0 24 24"><path d="M12 1.8l3 7.1 7.7.6-5.9 5 1.8 7.5L12 18l-6.6 4 1.8-7.5-5.9-5 7.7-.6z"/></svg></span></h1>

  <div class="depts">
    <div class="dept">
      <div class="ic"><svg viewBox="0 0 24 24"><rect x="2.5" y="3.5" width="19" height="13" rx="2"/><path d="M8 20.5h8M12 16.5v4"/></svg></div>
      <div><b>الحاسوب</b><p>دورات عملية في الحاسوب</p></div>
    </div>
    <div class="dept">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 4.5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3.5v-3.5H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z"/><path d="M19.5 9.5H20a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-.5V21l-3.5-2.5h-4"/></svg></div>
      <div><b>اللغات</b><p>الإنجليزية في 10 مستويات</p></div>
    </div>
    <div class="dept">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M2.5 5.5c3-1.3 6.2-1.3 9.5.8v13.4c-3.3-2.1-6.5-2.1-9.5-.8z"/><path d="M21.5 5.5c-3-1.3-6.2-1.3-9.5.8v13.4c3.3-2.1 6.5-2.1 9.5-.8z"/></svg></div>
      <div><b>التقوية</b><p>دروس تقوية للطلاب</p></div>
    </div>
  </div>

  <div class="go">سجّل الآن</div>
  <div class="wa">
    <svg viewBox="0 0 24 24"><circle class="wa-bg" cx="12" cy="12" r="11"/><path class="wa-fg" d="M9.1 6.6c.3 0 .5 0 .7.5l.8 1.9c.1.3 0 .5-.1.7l-.6.7c-.1.2-.2.3 0 .6.5.9 1.2 1.7 2 2.3.6.4 1 .6 1.3.7.2.1.4 0 .5-.1l.7-.9c.2-.2.4-.2.6-.1l1.8.9c.3.1.4.2.4.4.1.6-.1 1.5-.8 2-.9.6-2 .7-3.6.1-1.9-.8-3.6-2.4-4.6-4.2-.8-1.4-.8-2.8.1-3.9.3-.4.6-.6.8-.6z"/></svg>
    <div><small>للتسجيل والاستفسار عبر واتساب</small><span class="num">0904 011 473</span></div>
  </div>
</div>
</body>
</html>
