<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>General post</title>
<link rel="stylesheet" href="ad.css">
<style>
/* A square post for Facebook, Instagram and WhatsApp: the institute and its three departments. */
:root{--w:1080px;--h:1080px}
.ad{background:var(--navy);color:#fff;padding:72px 76px 64px;display:flex;flex-direction:column}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.07)}
.ring.r1{width:900px;height:900px;left:-380px;top:-330px}
.ring.r2{width:640px;height:640px;left:-250px;top:-200px}
h1 .star{display:inline-block;width:58px;height:58px;fill:var(--orange);margin-right:18px;vertical-align:top;margin-top:6px}
.brand .logo{width:132px;height:132px}
.brand .name b{font-size:40px}
.brand .name span{font-size:30px;color:var(--orange-l)}
.brand .name i{font-size:16px;color:rgba(255,255,255,.6);margin-top:4px}
h1{margin-top:58px;font-weight:800;font-size:100px;line-height:1.12}
h1 span{display:block;color:var(--orange-l)}
.depts{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.dept{background:#fff;color:var(--ink);border-radius:26px;padding:28px 26px 26px}
.dept .ic{width:76px;height:76px;border-radius:22px;background:var(--orange-soft);display:grid;place-items:center}
.dept .ic svg{width:44px;height:44px;stroke:var(--orange);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dept b{display:block;margin-top:18px;font-size:40px;font-weight:800;color:var(--navy);line-height:1.2}
.dept p{margin-top:6px;font-size:24px;font-weight:600;color:var(--muted);line-height:1.45}
.cta{margin-top:36px}
.cta .go{font-size:38px;padding:12px 44px 16px}
.cta .wa small{display:block;font-size:24px;font-weight:600;color:rgba(255,255,255,.75);line-height:1.3}
.cta .num{display:block;font-size:44px;white-space:nowrap;line-height:1.2}
.cta .wa svg{width:64px;height:64px}
</style>
</head>
<body>
<div class="ad ar">
  <div class="ring r1"></div><div class="ring r2"></div>
  <div class="brand">
    <div class="logo"><img src="../../assets/branding/fvi_logo.png" alt=""></div>
    <div class="name"><b>معهد الرؤية المستقبلية</b><span>للحاسوب واللغات</span><i>FUTURE VISION INSTITUTE</i></div>
  </div>

  <h1>رؤيتك للمستقبل<span>تبدأ من هنا<svg class="star" viewBox="0 0 24 24"><path d="M12 1.8l3 7.1 7.7.6-5.9 5 1.8 7.5L12 18l-6.6 4 1.8-7.5-5.9-5 7.7-.6z"/></svg></span></h1>

  <div class="depts">
    <div class="dept">
      <div class="ic"><svg viewBox="0 0 24 24"><rect x="2.5" y="3.5" width="19" height="13" rx="2"/><path d="M8 20.5h8M12 16.5v4"/></svg></div>
      <b>الحاسوب</b><p>دورات عملية<br>في الحاسوب</p>
    </div>
    <div class="dept">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 4.5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3.5v-3.5H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z"/><path d="M19.5 9.5H20a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-.5V21l-3.5-2.5h-4"/></svg></div>
      <b>اللغات</b><p>الإنجليزية<br>في 10 مستويات</p>
    </div>
    <div class="dept">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M2.5 5.5c3-1.3 6.2-1.3 9.5.8v13.4c-3.3-2.1-6.5-2.1-9.5-.8z"/><path d="M21.5 5.5c-3-1.3-6.2-1.3-9.5.8v13.4c3.3-2.1 6.5-2.1 9.5-.8z"/></svg></div>
      <b>التقوية</b><p>دروس تقوية<br>للطلاب</p>
    </div>
  </div>

  <div class="cta">
    <div class="go">سجّل الآن</div>
    <div class="wa">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1FA855"/><path fill="#fff" d="M9.1 6.6c.3 0 .5 0 .7.5l.8 1.9c.1.3 0 .5-.1.7l-.6.7c-.1.2-.2.3 0 .6.5.9 1.2 1.7 2 2.3.6.4 1 .6 1.3.7.2.1.4 0 .5-.1l.7-.9c.2-.2.4-.2.6-.1l1.8.9c.3.1.4.2.4.4.1.6-.1 1.5-.8 2-.9.6-2 .7-3.6.1-1.9-.8-3.6-2.4-4.6-4.2-.8-1.4-.8-2.8.1-3.9.3-.4.6-.6.8-.6z"/></svg>
      <div><small>للتسجيل والاستفسار عبر واتساب</small><span class="num">0XXX XXX XXX</span></div>
    </div>
  </div>
</div>
</body>
</html>
